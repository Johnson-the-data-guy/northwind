name: ci/cd
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Drop build-only packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm prune --omit=dev
      - name: Create release environment file
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "RELEASE=${{ github.sha }}" >release.env
      - name: pack release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf northwind-${{ github.sha }}.tgz package.json package-lock.json dist node_modules server.js content release.env
      - name: Upload release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: release
          path: northwind-${{ github.sha }}.tgz
  


  staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOST }}" > ~/.ssh/known_hosts

      - name: stream release artifact to staging server
        run: ssh deploy@${{ secrets.DEPLOY_HOST }} "mkdir -p /opt/northwind-staging/releases/${{ github.sha }} && tar -xzf - -C /opt/northwind-staging/releases/${{ github.sha }}" < northwind-${{ github.sha }}.tgz
      - name: Activate release on staging server
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "ln -sfn /opt/northwind-staging/releases/${{ github.sha }} /opt/northwind-staging/current.tmp &&
          mv -T /opt/northwind-staging/current.tmp /opt/northwind-staging/current &&
          sudo systemctl restart northwind-staging"
      - name: Smoke test staging server
        run: |
         sleep 3
         curl -fsS https://staging.northwind-design.online/health | grep -q ${{ github.sha }} || (echo "Smoke test failed" && exit 1)
      - name: Delete old releases on staging server
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /opt/northwind-staging/releases && ls -1t | tail -n +2 | xargs rm -rf"
          

      
  deploy:
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://northwind-design.online
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: release

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOST }}" > ~/.ssh/known_hosts

      - name: copy release artifact to server
        run: scp northwind-${{ github.sha }}.tgz deploy@${{ secrets.DEPLOY_HOST }}:/opt/northwind/releases/

      - name: Activate release on server
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "mkdir -p /opt/northwind/releases/${{ github.sha }} &&
          tar -xzf /opt/northwind/releases/northwind-${{ github.sha }}.tgz -C /opt/northwind/releases/${{ github.sha }} &&
          ln -sfn /opt/northwind/releases/${{ github.sha }} /opt/northwind/current.tmp &&
          mv -T /opt/northwind/current.tmp /opt/northwind/current &&
          rm /opt/northwind/releases/northwind-${{ github.sha }}.tgz && sudo systemctl restart northwind"
      - name: Smoke test
        run: |
         sleep 3
         curl -fsS https://northwind-design.online/health | grep -q ${{ github.sha }} || (echo "Smoke test failed" && exit 1)

      - name: Delete old releases on server
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /opt/northwind/releases && ls -1t | tail -n +6 | xargs rm -rf"
