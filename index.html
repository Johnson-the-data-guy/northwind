<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Northwind Design Studio is a four-person creative agency working in identity, print and digital." />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Northwind Design Studio</title>
    <script>
      try {
        if (localStorage.getItem('northwind-theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch {
        // Storage can be blocked; dark stays the default.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
